[package]
name = "loupe_ffi"
version = "0.1.0"
edition = "2021"
publish = false

# C-ABI static libs, one per iOS slice, stitched into LoupeFFI.xcframework by build-rust.sh.
[lib]
name = "loupe_ffi"
crate-type = ["staticlib"]

[dependencies]
# The device-services crate. PIN a concrete version — the FFI wrappers in src/lib.rs
# are written against a given API surface and the crate's function names/signatures
# move between releases. Reconcile `// FFI:` notes in src/lib.rs with the version you pin.
idevice = { version = "0.1", features = ["tcp", "pair", "debug", "pcapd", "afc", "installation"] }

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
once_cell = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
