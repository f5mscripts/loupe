[package]
name = "loupe_ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "loupe_ffi"
crate-type = ["staticlib"]

[dependencies]
# idevice 0.1.68 — same crate EscapeOS/StikJIT use. Valid feature names (verified
# against the crate): remote_pairing pulls RpPairingFile + the TLS-PSK tunnel.
# default = ["aws-lc"] gives rustls + aws-lc-rs (cross-compiles to iOS arm64).
# More features (installation_proxy, core_device, debug_proxy, pcapd, …) get added
# per milestone as the backend wires each service.
# ring TLS backend (default-features=false drops aws-lc): ring cross-compiles to
# aarch64-apple-ios far more reliably than aws-lc-rs and builds faster.
idevice = { version = "0.1.68", default-features = false, features = ["remote_pairing", "ring"] }

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
once_cell = "1"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
