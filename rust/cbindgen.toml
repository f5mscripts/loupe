language = "C"
pragma_once = true
include_guard = "LOUPE_FFI_H"
autogen_warning = "/* Generated by cbindgen from rust/src/lib.rs. Do not edit by hand. */"
tab_width = 4
documentation = true
style = "type"

# No export.prefix — our symbols are already loupe_* / Loupe* and #[no_mangle];
# a prefix would rename the header declarations and break linking.

[parse]
parse_deps = false
