name: Loupe
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Set these to your paid-account values (or move to an .xcconfig):
    DEVELOPMENT_TEAM: "YOUR_TEAM_ID"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages: {}

targets:
  Loupe:
    type: application
    platform: iOS
    sources:
      # Includes all Swift + bundles interceptor.js (xcodegen adds non-source files
      # to the resources phase automatically — no separate entry, or it duplicates).
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          # These are referenced by build settings, not copied as bundle resources
          # (copying them collides with INFOPLIST_FILE / CODE_SIGN_ENTITLEMENTS).
          - Info.plist
          - Loupe.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.loupe
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Loupe.entitlements
        # Rust device-services FFI. Built by ./build-rust.sh (CI runs it before
        # xcodegen). The Swift still compiles without it via #if canImport(LoupeFFI).
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/build/xcframework
        OTHER_LDFLAGS:
          - $(inherited)
    dependencies:
      # Static-library xcframework: link only, never embed (embedding a static lib errors).
      - framework: build/xcframework/LoupeFFI.xcframework
        embed: false
